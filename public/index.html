<!DOCTYPE html>
<html>

<head>
    <title>Community Games Tracker</title>

    <style>
        body {
            background: #202225;
            color: white;
            font-family: Arial;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .card {
            background: #2f3136;
            padding: 30px;
            border-radius: 10px;
            width: 500px;
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            font-size: 16px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 14px;
            font-size: 18px;
            cursor: pointer;
            margin-top: 15px;
        }

        #message {
            margin-top: 15px;
            color: lightgreen;
        }
    </style>

</head>

<body>

    <div class="card">

        <h2>🎮 Community Games Tracker</h2>

        <input id="game1" placeholder="Game 1">

        <input id="game2" placeholder="Game 2">

        <input id="game3" placeholder="Game 3">

        <button onclick="saveGames()">
            Save Games
        </button>

        <p id="message"></p>

    </div>

    <script>

        async function saveGames() {

            const game1 = document.getElementById("game1").value;
            const game2 = document.getElementById("game2").value;
            const game3 = document.getElementById("game3").value;

            const response = await fetch("/api/save-games", {

                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({
                    game1,
                    game2,
                    game3
                })

            });

            const data = await response.json();

            document.getElementById("message").innerText = data.message;

        }

    </script>

</body>

</html>
