<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Community Games Tracker</title>

    <link rel="stylesheet" href="css/styles.css">

</head>

<body>

<div class="container">

    <h1>🎮 Community Games Tracker</h1>

    <div id="userSection"></div>

    <hr>

    <input
        id="search"
        type="text"
        placeholder="Search a game..."
        autocomplete="off">

    <div id="results"></div>

    <h3>Selected Games</h3>

    <ul id="selectedGames"></ul>

    <button id="saveBtn">

        Save Games

    </button>

    <hr>

    <h2>🏆 Community Leaderboard</h2>

    <div id="leaderboard">

        Loading...

    </div>

</div>

<script src="js/app.js"></script>

</body>

</html>
